# woof experiment translated from WRF namelists by `woof import-namelist`
# (namelist.wps + namelist.input).  WRF staggered e_we/e_sn/e_vert convert
# to woof mass dimensions nx/ny/nz (one fewer point).  Child dx/dt are NEVER
# written: woof/experiment.py derives them exactly from the parent chain
# (the namelist chain is authoritative).
# Physics substitutions (ratified, never silent):
#   ra_lw_physics/ra_sw_physics 4 (RRTMG) -> ra_physics 4 (RTE+RRTMGP)
#   mix_full_fields (False,) (WRF perturbation/full-field mixing by domain) -> mix_full_fields True (full-field mixing on every domain)

[experiment]
name = "temf-public-column-forecast"
start_time = 2026-10-08T00:00:00
run_seconds = 600.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 3600.0

[projection]
map_proj = "lambert"
ref_lat = 35.5
ref_lon = -97.5
truelat1 = 25.5
truelat2 = 45.5
stand_lon = -97.5

[shared]
# WRF e_vert = 31 staggered full levels -> nz = 30 mass levels.
nz = 30
# Nominal vertical scaffold height; the real path derives heights from
# p_top/eta_levels.
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.96666667, 0.93333333, 0.9, 0.86666667,
    0.83333333, 0.8, 0.76666667, 0.73333333, 0.7,
    0.66666667, 0.63333333, 0.6, 0.56666667, 0.53333333,
    0.5, 0.46666667, 0.43333333, 0.4, 0.36666667,
    0.33333333, 0.3, 0.26666667, 0.23333333, 0.2,
    0.16666667, 0.13333333, 0.1, 0.06666667, 0.03333333,
    0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = "auto"
# WRF Registry defaults the namelist leaves unset, ratified binding for the
# reference configuration (Phase-4 native-dt baseline): emdiv 0.01,
# hypsometric_opt 2, h_sca_adv_order 5.
emdiv = 0.01
hypsometric_opt = 2
# Adaptive time step (Registry.EM_COMMON:2269-2281).  Off unless
# the namelist asked for it; with it off every value below is
# WRF's Registry default and nothing reads them.
use_adaptive_time_step = false
step_to_output_time = true
adaptation_domain = 1
target_cfl = 1.2
target_hcfl = 0.84
max_step_increase_pct = 5
starting_time_step = -1
starting_time_step_den = 0
max_time_step = -1
max_time_step_den = 0
min_time_step = -1
min_time_step_den = 0
h_sca_adv_order = 5
smdiv = 0.1
top_lid = true
moist = true
moist_cq = true
mp_physics = 6
morr_rimed_ice = 1
moist_adv_opt = 1
km_opt = 4
diff_6th_opt = 0
diff_6th_slopeopt = 0
w_damping = 0
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 10
sf_surface_physics = 2
bl_pbl_physics = 10
ra_physics = 4
sf_urban_physics = 0
use_wudapt_lcz = 0
num_urban_hi = 15
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
wsm6_hail_opt = 0
bldt = 0.0

[[domain]]
# WRF e_we = 33, e_sn = 25 (staggered) -> mass dimensions.
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 32
ny = 24
time_step = 10
dx = 12000.0
spec_exp = 0.0
specified = true
nested = false
history_interval_s = 600.0
radt = 15.0
cu_physics = 0
diff_6th_factor = 0.12

[fetch]
source = 'gfs'
cycle = '2026-10-08T00'
hours = 3
cadence = 3
area = '31,-102,40,-93'
out = '/workspace/shared-prepared/temf-public-gfs-2026100800'
