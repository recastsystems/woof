[package]
name = "rw-soundings"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true
description = "Public sounding viewer: rw-store columns -> rustwx-sounding column contract -> sharppyrs (SHARPpy SPC window) PNG + JSON"

[[bin]]
name = "rw_soundings"
path = "src/main.rs"

[dependencies]
rw-store = { path = "../rw-store" }
rustwx-sounding = { path = "../rustwx-sounding" }
sharppyrs = { path = "../../vendor/sharppyrs" }
sharprs = { path = "../../vendor/sharprs" }
egui = "0.34.3"
egui-wgpu = "0.34.3"
egui_kittest = { version = "0.34", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
flate2 = "1"
pollster = "0.4"

chrono = "0.4"
netcdf-reader = { version = "0.5", default-features = false }
# Compressed (NetCDF-4) history frames: the workspace's patched netcdf-reader (vendor/netcrust, [patch.crates-io]),
# whose chunk-parallel read inflates every chunk once, in parallel (input.rs nc4_time_slice). The 0.5 reader above
# is built without its NetCDF-4 side (its hdf5-reader 0.5 is not vendored) and keeps the classic route.
nc4-reader = { package = "netcdf-reader", version = "0.3", features = ["netcdf4", "rayon"] }
wrf-core = { git = "https://github.com/FahrenheitResearch/wrf-rust.git", rev = "93bd2ca670c13fec35bcfc27a58108e6fd71c627", default-features = false, features = ["pure-rust-reader"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
