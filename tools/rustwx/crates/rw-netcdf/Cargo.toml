# The NetCDF front door: the Rust half of every read gpuwm does of a
# NetCDF or NetCDF-4/HDF5 meteorological source.
#
# It exists because the Python half was decoding those files itself with
# `netCDF4.Dataset` while `netcrust` -- a WRF-focused pure-Rust
# NetCDF/NetCDF4 reader already vendored here and already driven by
# rw-wrfbatch, rw-sat and rw-fieldcmp -- sat beside it unused for that
# job.  The contract below deliberately mirrors `grib2_inventory` /
# `grib2_dump`, which is how the SAME module already reads GRIB2: a
# metadata pass on stdout and a bulk pass that writes flat little-endian
# f64 planes for numpy to map.  One decode idiom for both formats.
#
# Every dependency is already in this workspace's `cargo vendor`
# closure (netcrust by path, chrono/serde/serde_json from crates-io), so
# the bin builds --locked --offline like every other bundled artifact.

[package]
name = "rw-netcdf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "rw_netcdf"
path = "src/main.rs"

[dependencies]
# `clock` is NOT enabled: this bin decodes CF reference times out of a
# units string and never asks what time it is now.  A decoder whose
# output depends on the wall clock is a decoder that cannot be tested.
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "serde"] }
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
netcrust = { path = "../../vendor/netcrust" }
netcdf-writer = { path = "../netcdf-writer" }
obs-regrid = { path = "../obs-regrid" }
sha2 = "0.10"

# The workspace's own classic-format writer, so the suite BUILDS its
# classic fixtures at test time instead of checking in bytes nobody can
# regenerate.  It is an independent implementation from the netcrust
# read path under test, so a shared misreading of the spec cannot make
# a broken decode look correct.  The NetCDF-4/HDF5 fixtures cannot be
# built this way (nothing in the Rust stack writes HDF5, by design) and
# are checked in under tests/fixtures with the Python script that
# regenerates them.

wrf-surface = { path = "../../../rw_wps/crates/wrf-surface" }
