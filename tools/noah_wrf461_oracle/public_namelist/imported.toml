# woof experiment translated from WRF namelists by `woof import-namelist`
# (namelist.wps + namelist.input).  WRF staggered e_we/e_sn/e_vert convert
# to woof mass dimensions nx/ny/nz (one fewer point).  Child dx/dt are NEVER
# written: woof/experiment.py derives them exactly from the parent chain
# (the namelist chain is authoritative).
# Physics substitutions (ratified, never silent):
#   ra_lw_physics/ra_sw_physics 4 (RRTMG) -> ra_physics 4 (RTE+RRTMGP)
#   use_theta_m 1 (moist potential temperature (theta_m) prognostic) -> use_theta_m 0 (dry potential temperature)
#   mix_full_fields (False,) (WRF perturbation/full-field mixing by domain) -> mix_full_fields True (full-field mixing on every domain)
# &dynamics use_theta_m is omitted in the namelist: read as 1 on WRF line 4, from --wrf-version 4.

[experiment]
name = "wrf_2026100718_1dom"
start_time = 2026-10-07T18:00:00
run_seconds = 120.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 60.0

[projection]
map_proj = "lambert"
ref_lat = 68.0
ref_lon = -150.0
truelat1 = 58.0
truelat2 = 78.0
stand_lon = -150.0

[shared]
# WRF e_vert = 50 staggered full levels -> nz = 49 mass levels.
nz = 49
# Nominal vertical scaffold height; the real path derives heights from
# p_top/eta_levels.
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.5
# WRF Registry defaults the namelist leaves unset, ratified binding for the
# reference configuration (Phase-4 native-dt baseline): emdiv 0.01,
# hypsometric_opt 2, h_sca_adv_order 5.
emdiv = 0.01
hypsometric_opt = 2
# Adaptive time step (Registry.EM_COMMON:2269-2281).  Off unless
# the namelist asked for it; with it off every value below is
# WRF's Registry default and nothing reads them.
use_adaptive_time_step = false
step_to_output_time = true
adaptation_domain = 1
target_cfl = 1.2
target_hcfl = 0.84
max_step_increase_pct = 5
starting_time_step = -1
starting_time_step_den = 0
max_time_step = -1
max_time_step_den = 0
min_time_step = -1
min_time_step_den = 0
h_sca_adv_order = 5
smdiv = 0.1
top_lid = true
moist = true
moist_cq = true
mp_physics = 10
morr_rimed_ice = 1
moist_adv_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
ra_physics = 4
sf_urban_physics = 0
use_wudapt_lcz = 0
num_urban_hi = 15
ua_phys = true
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
bldt = 0.0

[[domain]]
# WRF e_we = 33, e_sn = 25 (staggered) -> mass dimensions.
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 32
ny = 24
time_step = 10
dx = 12000.0
spec_exp = 0.0
specified = true
nested = false
history_interval_s = 120.0
radt = 12.0
cu_physics = 0
diff_6th_factor = 0.12

[fetch]
source = "gfs"
cycle = "2026-10-07T18"
hours = 3
area = "64.0,-158.0,72.0,-142.0"
out = "public-inputs"
cadence = 3
