# The arm A configuration every case starts from: WOOF in the HRRR
# configuration on HRRR's own 3 km grid (HRRR analysis start, HRRR physics,
# RAP boundaries, fixed 20 s step), byte for byte the experiment.toml of the
# 10-05 full-CONUS run
# except its name.  make_arm_configs.py writes each case's copy by changing
# the start, the length and the boundary cycle only.
[experiment]
name = "heat-eval-template"
start_time = 2026-10-05T12:00:00
run_seconds = 43200.0
feedback = 1
smooth_option = 0
blend_width = 5
spec_bdy_width = 10
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 38.5
ref_lon = -97.5
truelat1 = 38.5
truelat2 = 38.5
stand_lon = -97.5

[shared]
