[package]
name = "arwen-waves-data"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "rw_waves_data"
path = "src/main.rs"

[[bin]]
name = "rw_waves_coupled_prepare"
path = "src/coupled.rs"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
flate2 = "1"
grib-core = { path = "../grib1_bridge/vendor/grib-core", features = ["jpeg2000", "png_codec"] }
netcrust = { path = "../rustwx/vendor/netcrust" }
netcdf-writer = { path = "../rustwx/crates/netcdf-writer" }
