[[knobs]]
name = "physics.rrtmg.radius_snow"
family = "physics"
units = "fractional change"
min = -0.2
max = 0.2
default = 0
description = "Changes snow radius supplied to radiation including the ice to snow fallback."
parameter = "rrtmg.radius_snow"
kind = "family-source"
physical_default = 1
scheme = "legacy radiation"
range_basis = "Conservative inferred radius multiplier around the existing diagnosed radius. The source tests cloud radii of 5-25 micrometres; native optical validity checks remain active."
reference = "https://dtcenter.org/sites/default/files/visitor-projects/Iacono_Henderson_DTC_FinalReport_2016.pdf"
[knobs.requires]
use_mp_re = [1]
ra_lw_physics = [4]
ra_sw_physics = [4]
[knobs.conditions]
ra_rrtmg_variant = ["rrtmg_legacy"]
[[knobs.sites]]
module = "rrtmg_legacy_prep"
anchor = "RP_RADIUS(rs[j])"
literal = "RP_RADIUS(rs[j])"
count = 1
