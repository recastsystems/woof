[[knobs]]
name = "physics.rrtmg.overlap_break_fraction"
family = "physics"
units = "subcolumn fraction"
min = 0
max = 1
default = 0
description = "Changes a fraction of radiation subcolumns from maximum random overlap to random overlap."
parameter = "rrtmg.overlap_break_fraction"
physical_default = 0
transform = "absolute"
kind = "family-source"
scheme = "legacy radiation"
range_basis = "Explicit new mixture between two published overlap endpoints, not the exponential decorrelation model. Zero retains the original maximum random operator."
reference = "https://dtcenter.org/sites/default/files/visitor-projects/Iacono_Henderson_DTC_FinalReport_2016.pdf"
[knobs.requires]
ra_lw_physics = [4]
ra_sw_physics = [4]
