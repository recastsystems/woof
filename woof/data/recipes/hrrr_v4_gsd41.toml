# HRRR v4 source configuration on HRRR's own 1799 x 1059 mass grid.
# Stage WIF and the published native-grid static fields.
# The GSD MYNN source version is explicit. Remaining fork rows are in docs/dev/mynn-gsd41.md.
# This grid needs a larger card than the home nodes. Do not run it there.
[experiment]
name = "hrrr-v4-fork-configuration"
start_time = 2026-10-02T21:00:00
run_seconds = 7200.0
feedback = 1
smooth_option = 0
blend_width = 5
spec_bdy_width = 10
restart_interval_s = 0.0
# HRRR &domains smooth_cg_topo = .true. (hrrr_wrf.nl, hrrr_real.nl): the outer
# spec_bdy_width + blend_width rows of terrain blend toward RAP's own terrain.
smooth_cg_topo = true

[projection]
# HRRR's Lambert grid (hrrr_namelist.wps).
map_proj = "lambert"
ref_lat = 38.5
ref_lon = -97.5
truelat1 = 38.5
truelat2 = 38.5
stand_lon = -97.5

[static]
source = "hrrr-conus-v4"

[shared]
gwd_opt = 3
topo_wind = 0
bl_mynn_mixlength = 2
bl_mynn_version = "gsd_41"
bl_mynn_gsd41_unsquared_qtke = false
bl_mynn_cloud_tendency_form = "wrf_461"
mynn_sfclay_variant = "gsl_wrf39"
# The operational WRF 3.9 fork's Thompson generation (mp_physics = 28).
thompson_version = "wrf_39_noaa"
scalar_pblmix = 1
alb_sol = 1
zadvect_implicit_variant = "wrf_legacy"
mosaic_lu = 1
mosaic_soil = 1
sf_lake_physics = 1
# WRF e_vert = 51 staggered levels -> nz = 50 mass levels, HRRR's own eta ladder.
nz = 50
ztop = 20000.0
# Native hybrid columns support the operational 15 hPa model top.
p_top = 1500.0
eta_levels = [
    1.0, 0.998, 0.994, 0.987, 0.975,
    0.959, 0.939, 0.916, 0.892, 0.865,
    0.835, 0.802, 0.766, 0.727, 0.685,
    0.64, 0.592, 0.542, 0.497, 0.4565,
    0.4205, 0.3877, 0.3582, 0.3317, 0.3078,
    0.2863, 0.267, 0.2496, 0.2329, 0.2188,
    0.2047, 0.1906, 0.1765, 0.1624, 0.1483,
    0.1342, 0.1201, 0.106, 0.0919, 0.0778,
    0.0657, 0.0568, 0.0486, 0.0409, 0.0337,
    0.0271, 0.0209, 0.0151, 0.0097, 0.0047,
    0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
# HRRR &dynamics
time_step_sound = 6
epssm = 0.1
emdiv = 0.01
smdiv = 0.1
hypsometric_opt = 2
h_sca_adv_order = 5
# HRRR v_mom_adv_order = v_sca_adv_order = 5 (hrrr_wrf.nl); omitted they resolve to 3.
v_mom_adv_order = 5
v_sca_adv_order = 5
moist_adv_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
diff_6th_thresh = 0.05
# The fork's sixth-order filter: moist and scalar rows take diff_6th_factor2
# = 0.04 (hrrr_wrf.nl; fork solve_em.F rk_scalar_tend calls), not 0.12.
diff_6th_form = "noaa_wrf39"
diff_6th_factor2 = 0.04
# The fork's advance_w upper-wind limiter (module_small_step_em.F:1703-1735).
upper_wind_limiter_form = "noaa_wrf39"
# hrrr_wrf.nl omits mix_full_fields (fork Registry default .false.).
mix_full_fields = false
moist_mix6_off = false
w_damping = 0
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
top_lid = false
# HRRR's implicit-explicit vertical advection (zadvect_implicit = 1); ported
# in 2.8.3 and run on the 4-card [devices] road in the smoke test.
zadvect_implicit = 1
terrain_opt = 1
map_proj = 1
# Fixed 20 s operational adaptive-clock bounds.
terrain_clock = "pinned"
use_adaptive_time_step = true
step_to_output_time = true
adaptation_domain = 1
# hrrr_wrf.nl target_cfl = 1.2; target_hcfl is the fork Registry default 0.84.
# Both are inert while min = max = 20 s pins the step.
target_cfl = 1.2
target_hcfl = 0.84
max_step_increase_pct = 5
starting_time_step = 20
starting_time_step_den = 0
max_time_step = 20
max_time_step_den = 0
min_time_step = 20
min_time_step_den = 0
# HRRR &bdy_control
spec_zone = 1
relax_zone = 9
# HRRR &physics
moist = true
moist_cq = true
mp_physics = 28
# hrrr_wrf.nl mp_zero_out = 2, mp_zero_out_thresh = 1.e-12; the fork always
# applies it to the number arrays too (solve_em.F:4078-4141).
mp_zero_out = 2
mp_zero_out_thresh = 1.0e-12
mp_zero_out_all = 1
# hrrr_wrf.nl hailcast_opt = 1 (haildt = 60 s).
hailcast_opt = 1
# Operational GSD output with the fork's 60-minute maxima reset.
# The fork GSD package below owns the interval arrays.
nwp_diagnostics = 0
# module_diag_cl climate-statistics windows (minutes).
output_diagnostics = 1
diag_int = 15
wind_int = 5
gsd_diagnostics = 1
reset_interval1 = 60
prec_acc_dt = 60.0
prec_acc_dt1 = 15.0
# Three-dimensional aerosol initial and boundary values come from RAP.
# (HRRR's metgrid constants_name QNWFA_QNIFA_Monthly_GFS); staged by
# `woof fetch-tables --wif`.
aer_init_opt = 1
wif_input_opt = 1
use_rap_aero_icbc = true
bl_pbl_physics = 5
sf_sfclay_physics = 5
sf_surface_physics = 3
ruc_soilprop = "wrf_45"
ruc_irrigation = "wrf_45"
ruc_snow = "wrf_45"
ruc_qvg_cold_start = "air"
ruc_2m_diagnostic = "log_profile"
rdlai2d = true
usemonalb = true
num_soil_layers = 9
# hrrr_wrf.nl fractional_seaice = 1: RUC takes the ice column at XICE >= 0.02.
fractional_seaice = 1
# hrrr_wrf.nl seaice_threshold = 271.4: real.exe turns open water colder than this into sea ice.
seaice_threshold = 271.4
# fork Registry default (hrrr_wrf.nl omits it); inert while w_damping = 0
w_crit_cfl = 2.0
# Operational HRRR runs no ocean model (hrrr_wrf.nl sets no sf_ocean_physics;
# fork Registry default 0). Pinned so a 48 h run does not take the multi-day
# mixed-layer ocean default.
sf_ocean_physics = 0
# Sea ice is RUC's own ice column with the analysed ice fraction held, as in
# operational HRRR; the zero-layer prognostic ice model stays off.
seaice_prognostic = false
# ra_lw_physics = ra_sw_physics = 4, WRF's own RRTMG (legacy engine), every 15 min.
ra_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
ra_rrtmg_variant = "rrtmg_legacy"
rrtmg_cloud_optics_form = "noaa_wrf39"
aer_opt = 3
swint_opt = 1
# HRRR-Smoke (hrrr_wrf.nl &chem): chem_opt = 18 is the one transported smoke
# tracer, the smoke set (satellite fires with Freitas plume rise every
# plumerisefire_frq = 60 min, bb_dcycle diurnal cycle, vertmix_onoff = 1,
# wetscav_onoff = -1 washout). HRRR's own 3-D smoke is the start state
# (hrrr-native-smoke) and RAP's smoke the edge values (rap-native-smoke), as
# operational HRRR; fire emissions are NOAA RAVE (rave-3km), where HRRR v4's
# own prep reads VIIRS/MODIS active fires (named divergence).
# simple_dir_fdb = 1: the smoke's layer AOD joins the aer_opt = 3 shortwave,
# MIN(3) per layer, so thick plumes dim the sun (aer_ra_feedback stays 0).
# enh_vermix: stronger mixing over burning columns; flam_part = 0.75 of the
# fire emission rides the plume; aer_drydep_opt = 111: the fork's smoke dry
# deposition velocity. &dynamics chem_adv_opt = 2 (monotonic), chem_mix6_off.
#
# HRRR-Smoke is off by default in 2.9.4 (opt in with --smoke; it currently
# costs ~11x per step); history is hourly (the 15-min history subset stream
# is next release): on full CONUS, 8x RTX 5090, ordinary steps 3.50 s with
# smoke vs 0.295 s without, radiation steps 5.0-5.4 s vs 1.85 s.  The keys
# below are the smoke-off form (chemistry off, every other chem switch at its
# default).  --smoke on woof go, woof domain --recipe, woof standby and
# woof race restores the smoke-on set described above from ONE place,
# woof.smoke_execution.HRRR_SMOKE_SETTINGS:
#   chem_sets = "smoke", chem_sources = "rave-3km,rap-native-smoke,hrrr-native-smoke",
#   simple_dir_fdb = 1, biomass_burn_opt = 4, enh_vermix = true, flam_part = 0.75,
#   aer_drydep_opt = 111, chem_adv_opt = 2, chem_mix6_off = true, vertmix_onoff = 1,
#   wetscav_onoff = -1, plumerisefire_frq = 60, chem_conv_tr = 0
chem_sets = ""
chem_sources = ""
simple_dir_fdb = 0
smoke_off_reason = "HRRR-Smoke is off by default in 2.9.4 (opt in with --smoke; it currently costs ~11x per step); history is hourly (the 15-min history subset stream is next release)"
bldt = 0.0

[[domain]]
# HRRR e_we = 1800, e_sn = 1060: 1799 x 1059 mass points, HRRR's own grid
# point for point (the native static file pairs by identity, so its relaxation
# zone sits on HRRR's own outer rows; the old one-row trim is retired).
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 1799
ny = 1059
time_step = 20
dx = 3000.0
spec_exp = 0.0
specified = true
nested = false
# Hourly history in 2.9.4.  NOAA's HRRR writes every 15 min to f18, then
# hourly (history_interval = 15, history_interval2 = 60,
# history_interval_change = 1080); each full write blocks the step loop
# 10-30 s on full CONUS (V61), so the 15-min history subset stream is a named
# next-release item and this recipe writes hourly.
history_interval_s = 3600.0
radt = 15.0
cu_physics = 0
diff_6th_factor = 0.12

[output]
# HRRR's own output shape: the 15-minute frames are a 2-D subset (its
# wrfsubh files) and the full 3-D history is hourly.  Every frame at a whole
# hour is the full history; the frames between are the surface state,
# accumulators and column maxima plus REFL_10CM, about 1.3 GB instead of
# 18.7 GB on the CONUS grid.  Full 15-minute history wrote 18.7 GB every
# 15 model minutes, faster than the writer lands it, and the step loop
# blocked 10-30 s per write (V61 8x RTX 5090, 2026-10-21).
full_history_interval_s = 3600.0
between_preset = "minimal"
between_history_add = ["REFL_10CM", "REFD_MAX", "WSPD10MAX", "W_UP_MAX", "W_DN_MAX",
    "UP_HELI_MAX16", "GRPL_MAX", "HAIL_MAX2D", "SR"]

[fetch]
source = "rap-native"
initial_source = "hrrr-native"
# Nominal cycle = analysis time. RAP f03..f51 of the previous cycle
# covers a 48 h forecast. RAP-native remains selectable for either role.
boundary_cycle_offset_hours = -3
boundary_lead_offset_hours = 3
cycle = "2026-10-02T21"
hours = 3
# Hourly boundaries, the route's own default: RAP posts every hour. A 3 h row
# interpolates the inflow state over 3 h, which thinned the inflow cloud and left
# the rim stations 0.9 K warm and 110 W/m2 sunnier than HRRR at f02 on a HRRR-lattice
# crop; hourly boundaries halved that (plains-t2-bias, WOOF-FIX-PROGRAM 2026-10-06).
cadence = 1
