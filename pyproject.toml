[build-system]
# >=77 turns the SPDX `license` string into License-Expression metadata.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recast-woof"
version = "1.1.4"
description = "Recast WOOF: GPU-native regional weather forecasting with WRF-class physics, data assimilation and native preprocessing, plus the hex model (a GPU port of MPAS-Atmosphere v8.4.2) and its global configuration"
readme = "README.md"
license = "Apache-2.0"
# Every licence whose terms ask for its text to travel with the copy ships
# in the wheel and the sdist under the dist-info licenses/ folder.
license-files = ["LICENSE", "NOTICE", "licenses/*", "licenses/soundings/*"]
requires-python = ">=3.11"
# numpy>=2: the FP32 radiation chains rely on NEP-50 weak promotion.
# jsonschema: every forecast validates its certification capsule.
# scipy, pyshp: the vad-region dealiasing engine and the basemap reader.
# cdsapi: the ERA5 route through the Copernicus CDS.
# threadpoolctl: preparation workers size the numeric thread pools they load.
# psutil: host memory and process accounting (the engine's own base set).
# recast-woof-data: reference tables and map assets, pinned to this version.
dependencies = ["numpy>=2.0", "netCDF4>=1.6", "matplotlib>=3.8",
                "jsonschema>=4.0", "threadpoolctl>=3.1",
                "scipy>=1.11", "pyshp>=2.3", "cdsapi>=0.7.7", "psutil>=5.9", "recast-woof-data==1.1.4"]
keywords = ["WRF", "WPS", "GRIB", "NetCDF", "weather", "CUDA", "MPAS", "data-assimilation"]
classifiers = [
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/recastsystems/woof"
Repository = "https://github.com/recastsystems/woof"
Changelog = "https://github.com/recastsystems/woof/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# One CuPy/CUDA major per environment.
gpu-cu12 = ["cupy-cuda12x[ctk]>=14.0"]
gpu-cu13 = ["cupy-cuda13x[ctk]>=14.0"]
gpu = ["recast-woof[gpu-cu12]"]
# The wrf-rust Python bindings, for the renderer's Python-side helpers.
render = ["wrf-rust>=0.2.39,<0.3"]
# The legacy Python warp path of the high-resolution static builder; the
# default path is the Rust static-fields library in the bundle.
geog = ["rasterio>=1.3", "pyproj>=3.6"]
obs = []
dealias = []
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "pyyaml>=6.0", "setuptools>=77", "ruff==0.13.3"]
publish = ["huggingface_hub>=0.23", "h5py>=3.10"]
# The CONUS NHDPlus V2.1 hydro provider reads EPA's .7z source archives.
# py7zr and its codecs are LGPL-2.1-or-later, outside the permissive licences
# the default install carries, so they are an explicit extra: without it
# `--hydro on` on a CONUS domain prepares the worldwide fabric instead and
# says why (woof.hydro.acquire).
hydro-conus = ["py7zr>=1.0"]
all-cu12 = ["recast-woof[gpu-cu12]", "recast-woof[render]"]
all-cu13 = ["recast-woof[gpu-cu13]", "recast-woof[render]"]
all = ["recast-woof[all-cu12]"]

[project.scripts]
woof = "woof.cli:main"
woof-carried-channel = "tools.carried_physics_channel:main"
woof-wrf-init = "woof.source_cli:main"
rw-wps = "woof.source_cli:main"
woof-wrf-runtime-check = "woof.native_wrf_distribution:main"
woof-mapped-inspect = "woof.mapped_source:main"
woof-prepared-forecast = "woof.prepared_single_domain_forecast:main"
woof-prepared-tree-forecast = "woof.prepared_domain_tree_forecast:main"
woof-member-prep = "woof.member_prep:main"

[tool.setuptools.packages.find]
include = ["woof", "woof.*", "tools", "tilestream*", "configs*", "docs", "mpas_cycle_bridge*"]
# woof.hex.mod is a name reserved for a private extension row; extra rows
# arrive through the woof.hex.rows entry-point group instead.
exclude = ["tilestream.rescued-tools*", "tilestream.skeptic*", "recast-woof-data*",
           "woof.hex.mod", "woof.hex.mod.*"]

[tool.setuptools.package-data]
woof = [
    "*.json",
    "authorities/**/*",
    "data/**/*",
    # The prebuilt Rust bridges, present only in a platform wheel (setup.py).
    "libexec/bridges/*",
    # (1.1.0 r13) engine 2.9.4's own package data: the ocean, hydro and timeline tables and the hydro kernels
    # (`woof --help` stopped on the missing woof/ocean/rows.json in the r13 install check)
    "hydro/*.json",
    "ocean/*.json",
    "timeline/*.json",
    "hydro/*.cu",
    "hydro/*.cuh",
    "hydro/PET-LICENSE",
    "hydro/PET-TERMS.md",
]
"woof.core.kernels" = ["*.cu", "*.cuh", "**/*.cu", "**/*.cuh", "*.cpp", "**/NOTICE-*.txt", "LICENSE-third-party.txt"]
"woof.ocean.waves" = ["*.cu", "*.json", "*.md", "native/*.rs", "native/*.sh", "native/NETCDF-COPYRIGHT", "examples/*.json"]
# (1.1.4) engine 2.9.11's new package data: nudging's kernels (--nudging spectral stopped on a missing kernel
# without them) and the wave preparation's public source table
"woof.ocean.waves.data" = ["*.json", "*.md"]
"woof.spectral_nudging" = ["*.cu", "WRF-NOTICE.txt"]
"woof.ocean.surge" = ["kernels/*.cu", "examples/*.json", "examples/*.py", "*.md", "tests/*.c"]
"woof.ocean.seaice" = ["*.cu", "README.md"]
"woof.ocean.mixed_layer" = ["*.cu", "*.md", "WRF-NOTICE.txt"]
"woof.hydro" = ["kernels/*.cu", "kernels/t-route-LICENSE.txt", "kernels/t-route-TERMS.txt"]
"woof.hydro.noahowp" = ["*.cu", "schema.json", "LICENSE", "UPSTREAM-TERMS.md", "NOTICE", "parameters/*.TBL"]
"woof.native_step" = ["*.c", "README.md"]
"woof.obs" = ["data/**/*"]
"woof.verify" = ["*.json"]
"woof.certify" = ["*.json"]
"woof.ingest" = ["*.md"]
# (1.1.0) hex 0.4.0's own package-data list (its pyproject), so the wheel carries what hex reads at run time:
# native/upper_damping.rs (the forecast door refused "required ordinary file is missing" without it) and the
# init_gpu kernels (**/*.cu). libexec: the hex release's compiled helpers, present only in a platform wheel
# (stage_hex_helpers.py in the assembly stages them before that build).
# (1.1.2) native/*.c as gpuwm-hex ships it: the whole-step submission source woof.hex.native_step builds from
"woof.hex" = ["*.json", "**/*NOTICE*.txt", "data/*", "data/**/*", "libexec/*", "native/*.rs", "native/*.c", "*.cu", "*.cuh", "**/*.cu", "**/*.cuh"]
tools = ["prepare_hrrr_*.sh", "hydro_world/data/sources.v1.json", "hydro_world/data/recipes.v1.json",
         "hydro_world_params/data/params.v1.json"]
tilestream = ["output-scaling.json"]
configs = ["**/*"]
docs = ["mpas-seam.md"]

[tool.setuptools.exclude-package-data]
woof = []

[tool.pytest.ini_options]
markers = ["gpu: requires a CUDA GPU + cupy",
           "slow: an exhaustive sweep, minutes rather than seconds",
           "network: live-internet smoke, additionally gated on WOOF_NETWORK_TESTS=1",
           "static_rust_parity: static-fields bridge, builder and parity coverage; run with -m static_rust_parity",
           "static_platform_qualification: exact Python/Rust WPS comparisons reported by the dedicated platform qualification job",
           "bigcard: hex model tests that need the x4 full-physics free-memory floor",
           "assets: needs a byte-pinned data asset that ships with no fetch path",
           "doors: needs a staged Rust binary from a release bundle",
           "cpu_only: these tests must not open the local device"]
testpaths = ["tests", "tilestream"]
