# Five-day regional downscaling example. Nudging is opt-in through this table.
# Run: woof go examples/nudging/regional.toml --outdir nudged
# Control: add --nudging off and choose another --outdir.
[experiment]
name = "regional-nudging"
start_time = 2023-07-01T00:00:00
run_seconds = 432000.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 38.0
ref_lon = -97.0
truelat1 = 28.0
truelat2 = 48.0
stand_lon = -97.0

[shared]
nz = 49
ztop = 20000.0
p_top = 5000.0
eta_levels = [1.0, 0.9978, 0.99519, 0.99212, 0.98849, 0.98422, 0.97918, 0.97325, 0.96627, 0.95808, 0.94846, 0.93719, 0.92402, 0.90866, 0.89079, 0.87006, 0.84612, 0.81857, 0.78706, 0.75124, 0.7108, 0.66556, 0.61547, 0.56067, 0.50519, 0.45474, 0.40886, 0.36713, 0.32918, 0.29466, 0.26328, 0.23473, 0.20877, 0.18516, 0.16369, 0.14417, 0.12641, 0.11026, 0.09557, 0.08222, 0.07007, 0.05902, 0.04898, 0.03984, 0.03153, 0.02398, 0.0171, 0.01085, 0.00517, 0.0]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
alb_sol = 1
bl_pbl_physics = 5
diff_6th_opt = 2
diff_6th_slopeopt = 1
epssm = 0.5
fractional_seaice = 0
km_opt = 4
moist = true
moist_cq = true
morr_rimed_ice = 1
mosaic_lu = 0
mosaic_soil = 0
mp_physics = 8
num_soil_layers = 4
ra_lw_physics = 4
ra_physics = 0
ra_rrtmg_variant = "rrtmg_legacy"
ra_sw_physics = 4
rdlai2d = true
scalar_pblmix = 0
sf_sfclay_physics = 5
sf_surface_physics = 2
sf_urban_physics = 0
terrain_opt = 1
top_lid = true
usemonalb = true
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
wsm6_hail_opt = 0
map_proj = 1

[fetch]
source = "era5"
cycle = "2023-07-01T00"
hours = 120
area = "30.21,-108.33,45.50,-85.67"
out = "data"
era5_provider = "arco"
retrieve = true
cadence = 6

[output]
history_vars = ["T2", "Q2", "U10", "V10", "PSFC", "RAINNC", "RAINC", "T", "P", "PB", "PH", "PHB", "U", "V"]

[nudging]
enabled = true
cutoff_x = 1
cutoff_y = 1
relaxation_seconds = 5000.0
minimum_height_m = 1500.0
ramp_depth_m = 1500.0
boundary_cells = 5


[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 166
ny = 134
time_step = 45
dx = 9000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
