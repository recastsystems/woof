# ---------------------------------------------------------------------------
# FINE-CADENCE RESUME of the current CQ-on attempt #3 configuration.
# ---------------------------------------------------------------------------
# A checkpoint written by the current attempt #3 with moist_cq = true is
# required. The archived certified CQ-off checkpoint at 04:00Z is not
# restart-compatible: moist_cq changes the trajectory and is bound by the
# restart identity (woof/core/model.py restart_identity_payload).
#
# Relative to the current CQ-on attempt #3 file, this file changes the
# forecast length and three history cadences below. These fields are
# tolerated by woof/core/model.py
# RESTART_TOLERATED_{EXPERIMENT,DOMAIN,RUN}_FIELDS. The historical certified
# run supplies the cadence rationale and disk measurements, not a compatible
# checkpoint or a measured CQ-on forecast.
#
#   run_seconds               25200 -> 20700 s   00Z->07Z becomes 00Z->05:45Z,
#                                                a CQ-on resume at 04:00Z
#                                                integrates another 6300 s
#   d02 history_interval_s      900 -> 1800 s    context, coarsened
#   d03 history_interval_s      900 ->   60 s    the 500 m parent, matched at
#                                                twice the child's spacing
#   d04 history_interval_s      300 ->   30 s    THE DELIVERABLE
#
# `name` is NOT changed.  It is inside the restart identity, and it is also
# the truth: this is attempt #3, resumed.  The FILE is named for what it
# does; the EXPERIMENT keeps the name whose trajectory it continues.
#
# WHY 30 s.  The vortex lives 04:05Z-05:20Z (interior UH >= 1000), peaks
# 04:50-05:00Z at UH 6171 / w 48 m s-1 / 10 m wind 31.2 m s-1, and is gone by
# 05:50Z.  At 300 s that is 15 frames across the entire life cycle and 2
# across the peak, which is an interpolation, not an observation.  At 30 s it
# is 150 and 20.  The 100 m box is a TRANSIT box: at a 15-25 m s-1 storm
# motion a 30 s frame is 450-750 m of translation, under a tenth of the box.
#
# WHY THE WINDOW IS THE RUN.  There is no windowed-output mechanism in this
# codebase -- no auxhist streams, no history_begin/history_end, one uniform
# `history_interval_s` per domain per run.  Resuming at 04:00Z and stopping
# at 05:45Z makes the RUN the window, which needs no new mechanism, costs a
# quarter of the wall time, and leaves attempt #3's own 00Z-04:00Z output
# standing unchanged as the coarse remainder.
#
# THE 04:00Z FRAME IS NOT REWRITTEN.  restore_tree_restart marks every domain
# whose history alarm is due at the resume instant as already committed
# (woof/io/restart.py:2796-2798), so the first frame this run writes is
# 04:00:30Z. The 04:00Z frame belongs to the same CQ-on run that wrote
# the checkpoint; the historical CQ-off frame is a different trajectory.
#
# DISK, measured off attempt #3 arm a rather than estimated:
#   d04  182,835,921 B/frame x 210 frames  =  38.4 GB
#   d03  412,148,721 B/frame x 105 frames  =  43.3 GB
#   d02  926,675,121 B/frame x   3 frames  =   2.8 GB
#   d01  342,003,129 B/frame x   1 frame   =   0.3 GB
#   one restart set at 05:00Z               =   4.6 GB
#                                             --------
#                                              89.4 GB per arm
# d03 at 30 s would have been 86.9 GB on its own and is the reason it is at
# 60 s: the budget is 150 GB per arm and two arms have to fit two volumes.
#
# ATTEMPT #3 of the tornado-scale LES ladder.  Attempt #2 revision b's file,
# byte for byte, with ONE change: the LES children mix on a single isotropic
# length instead of per-axis ones.  Everything else -- the case, the chain,
# the placement, the raised lid, the vertical ladder, the physics profile,
# the ingest route -- is revision b's and is documented below unchanged.
#
# The revision-3 block near the end of this header is the only part of it
# that is new.  Read that first.
#
# READ docs/les/ATTEMPT2-EXPECTATIONS.md AND docs/les/attempt2/
# corridor-placement.json BEFORE TRUSTING ANY OUTPUT FROM THIS FILE.
# Attempt #1's own document, docs/les/ATTEMPT1-EXPECTATIONS.md, still
# describes the screens; this file changes where they are measured, not
# what they are.
#
# ---------------------------------------------------------------------------
# WHY THIS EXISTS: attempt #1 succeeded and pointed somewhere else
# ---------------------------------------------------------------------------
# Attempt #1 ran both arms of its dual-run pair clean over 00Z-06Z and the
# byte comparison adjudicated PASS, bit-identical, on 112 wrfout files and
# 5053 final-state digests.  Nothing about it failed.
#
# What it produced was a MEASUREMENT, and the measurement was that the box
# was in the wrong place.  Its d04 was centred on 36.72 N 88.70 W -- six
# kilometres southwest of Mayfield, which is where the REAL storm went.  Its
# own certified d02 output puts the model's violent cells 40-90 km southwest
# of that box and one to two hours later:
#
#     02Z   UH 877 @ 36.461 N 90.046 W
#     03Z   UH 691 @ 36.897 N 89.185 W
#     04Z   UH 494 @ 36.439 N 89.398 W      (UH 506 @ 37.117 N 88.545 W)
#     05Z   UH 610 @ 36.303 N 89.204 W      (UH 594 @ 36.597 N 88.876 W)
#     06Z   UH 357 @ 36.706 N 88.375 W
#
# (2-5 km updraft helicity maxima, m2 s-2, from arm a's hourly d02 frames;
# the full table is in docs/les/attempt2/corridor-placement.json.)
#
# A 20 km box cannot be placed on a track the model does not produce.  The
# ruled flow -- run the 3 km, find the actual cell, then downscale -- is what
# this file implements.  The placement below is derived from that table and
# from nothing else; the historical track is used only as a landmark, never
# as a target.
#
# ---------------------------------------------------------------------------
# WHAT MOVED, AND WHAT DID NOT
# ---------------------------------------------------------------------------
# MOVED:
#   d03  i/j_parent_start  151,151 -> 111,127   centre 36.720 -> 36.500 N,
#                                               88.700 -> 89.154 W
#   d04  i/j_parent_start  131,131 -> 132,120   centre 36.720 -> 36.450 N,
#                                               88.700 -> 89.149 W
#   d02  history_interval_s  3600 -> 900 s
#   run_seconds              21600 -> 25200 s   (00Z -> 07Z)
#
# NOT MOVED, deliberately:
#   d01 and d02 geometry, the projection, and the reference point.  Both
#   parents already hold the whole corridor -- d02 spans 34.64-38.75 N,
#   91.33-86.07 W -- so moving them would buy nothing and would throw away
#   the prepared caches that attempt #1 built and verified.  The projection
#   reference therefore STAYS at 36.72 N 88.70 W and is now simply a
#   projection origin rather than a box centre; d03 and d04 are no longer
#   concentric on it, which is the whole point.
#
#   Every physics switch, the 73-level eta ladder, the profile, the
#   timestep law, feedback = 0, and the inflow ruling.
#
# ---------------------------------------------------------------------------
# THE INFLOW RULING, CARRIED UNCHANGED
# ---------------------------------------------------------------------------
# inflow_perturbation is ON at d03 and OFF at d04, ruled 2026-08-06 and
# recorded at e754bc77.  d02 runs YSU and diagnoses a PBLH, so the generator
# has the parent it needs for d03.  d03 is itself LES: its RESOLVED eddies
# advect through d04's inflow faces and ARE the inflow turbulence, so
# injecting synthetic perturbations on top of them would double-count, and
# the model refuses it by contract.  Nothing about re-placing the nests
# touches that argument, so nothing about it changes here.
#
# ---------------------------------------------------------------------------
# THE 100 m BOX -- still a TRANSIT box, and still 20 km wide
# ---------------------------------------------------------------------------
# d04 is 200 x 200 cells at 100 m, spanning 36.358-36.541 N, 89.263-89.035 W.
# Verified against woof.static.projection on this exact geometry, using the
# same ProjectedGrid.nest registration the runner uses:
#
#   d03 clearance inside d02   110 / 190 / 126 / 174 parent rows (W/E/S/N)
#   d04 clearance inside d03   131 / 129 / 119 / 141 parent rows (W/E/S/N)
#   required                    10 parent rows (spec_bdy_width + blend_width)
#
# The storm enters d03's western half and gets ~66 km of in-domain transit
# before reaching d04's west edge -- comparable to attempt #1's 50-75 km, so
# the spin-up fetch risk registered there carries over unchanged and is
# still graded by screen E1.
#
# REGISTERED BEFORE THE RUN, and the honest limitation of this placement:
# the corridor was read off HOURLY d02 frames.  At the 13-23 m s-1 storm
# motion those frames imply, consecutive samples of one cell are 50-90 km
# apart while the box is 20 km wide, so the storm crosses the box BETWEEN
# samples and no hourly maximum need ever land inside it -- and none does.
# A straight-line interpolation between the 04Z and 05Z maxima of the
# strongest corridor cell puts it inside d04 from about 04:16Z to 04:39Z, a
# 19.3 km chord leaving through the NORTH edge.  That is an estimate from
# the crudest possible track model and it is NOT what the box was moved to
# fit; it is committed so that the 15-minute d02 frames this attempt writes
# can falsify it.  If they show the cell clipping a corner rather than
# transiting, the finding is that a fixed 20 km box needs 15-minute
# guidance to place -- which is exactly why d02's cadence changed.
#
# ---------------------------------------------------------------------------
# THE WINDOW
# ---------------------------------------------------------------------------
# 00Z -> 07Z, 25200 s, one hour longer than attempt #1.  The corridor's
# strongest crossings are 04-06Z, so the extra hour is tail past the event
# rather than more spin-up.
#
# NOT A RESTART.  The 02Z checkpoint set attempt #1 wrote cannot be used:
# woof/experiment.py refuses a re-placed nest against a prepared cache
# built at the old placement, and woof/io/restart.py gates the whole tree
# on one experiment fingerprint that carries i_parent_start -- so re-placing
# d03 also blocks resuming d01.  There is no per-domain restart selection
# and no supported path to cold-start a nest from its parent mid-run on the
# prepared-tree route.  Attempt #2 therefore integrates from 00Z, which
# costs about one extra hour of card per arm.  See
# docs/les/ATTEMPT2-EXPECTATIONS.md for the evidence.
#
# ---------------------------------------------------------------------------
# EVERYTHING BELOW THIS LINE IS ATTEMPT #1's, UNCHANGED EXCEPT WHERE NAMED
# ---------------------------------------------------------------------------
# The chain, the vertical grid, the physics profile, the parent/child
# turbulence split and the ingest route are all attempt #1's and are
# documented in configs/les_tornado_100m_mayfield_20211210.toml.  The
# summary: 3 km -> 1 km -> 500 m -> 100 m at ratios 3 / 2 / 5, dt =
# 15 / 5 / 2.5 / 0.5 s, nz = 72 on a stretched ladder with 33 half levels
# below 1.7 km, YSU + km_opt 4 on the parents, PBL off + km_opt 3 (3-D
# Smagorinsky) on the LES children, profile
# wsm6-ysu-mm5-noah-no-radiation-v1, HRRR 2021-12-11 00Z via the native
# front door.
#
# ---------------------------------------------------------------------------
# REVISION b: THE LID, RAISED.  p_top 10000 -> 5000 Pa, nz UNCHANGED at 72.
# ---------------------------------------------------------------------------
# Attempt #2 revision a ran this exact placement and physics and tripped the
# health gate at ~04:51 sim with
#
#     w(64, 159, 80) = -215.017 m/s   violates lower bound >= -200
#
# at d04, z = 10843 m, in the INTERIOR -- reproduced deterministically from
# the clean 04:00 checkpoint with the per-step gates on.  The cell was
# quiescent one frame earlier (w = +0.01 m/s at 04:50), so this is a
# numerical explosion out of still air, not a physical evolution.
#
# WHY.  The old lid sat at 16296 m, so the top-5 km Rayleigh sponge began at
# 11296 m -- BELOW the anvil of a violent supercell.  The storm's updraft was
# still 21 m/s at the failing level and 17.4 m/s inside the sponge, and
# in-sponge energy nearly DOUBLED in the five minutes before the trip
# (5.7 -> 8.5 -> 10.4 -> 9.4 -> 17.4 m/s from 04:20 to 04:50).  A Rayleigh
# sponge absorbs gravity waves in quiescent air; it is not built to have live
# convection driven through it.  The failing level sits 452 m below the
# sponge base, in a band protected by NEITHER the sponge NOR w_damp -- the
# latter being a COURANT limiter that at dz = 609 m and dt = 0.5 s would need
# w ~ 1218 m/s to fire.  Ruled out by measurement first: horizontal and
# vertical CFL (0.42 / 0.21 at d04, 2.2x margin), vertical stretching (1.035
# -1.058, well under 1.2), FP32 subnormals (nothing within 33 orders of the
# subnormal range at the cell), the lateral boundary, and the relaxation
# coefficients (dt-invariant, 10x margin).
#
# THE FIX, AND WHAT IT COSTS.  p_top 5000 Pa lifts the top half level from
# 15326 m to 18519 m and the sponge base to ~13.5 km, where w measured
# 1.5-3 m/s -- clear of the updraft.  nz stays 72; the eta ladder is
# regenerated for the new top by
#     tools/build_stretched_eta_ladder.py --nz 72 --dz0 20 --dz-max 650
#         --p-top 5000 --bl-top 1700 --require-below 30
#
# Every ratified vertical bound was RE-VERIFIED at the new lid rather than
# assumed, and every one still passes:
#
#     levels below 1.7 km      33 -> 31    (ratified FLOOR: >= 30)   PASS
#     levels below 2.0 km      35 -> 33    (spec V4 target 33-38)    PASS
#     effective dz in the BL   51.52 -> 54.84 m  (target 50-60 m)    PASS
#     first half level         10.00 m -> 10.00 m                    PASS
#
# So the trade is DELIBERATE and PRICED: two boundary-layer levels and 3.3 m
# of effective BL dz, bought against a model top a violent supercell cannot
# punch through.  It is not a criterion change -- the configuration moves
# WITHIN the bounds the project ratified -- which is why it did not need a new
# ruling.  Receipt: docs/les/attempt2/eta72-raisedlid.json.
#
# Revision a's config is FROZEN at
# configs/les_tornado_100m_mayfield_20211210_attempt2.toml (sha256
# 09734ca6...), because a committed result must keep pointing at the file it
# was produced under.  Its arm a output is the record of the crash AND of the
# science that motivated all of this: the re-placed box captured a violent
# tornadic vortex (UH 4287 m2 s-2, vertical vorticity 0.122 s-1, 33.5 m s-1
# surface winds, 62.5 dBZ) which is exactly what attempt #1's box never saw.
#
# ---------------------------------------------------------------------------
# ATTEMPT #3: ONE MIXING LENGTH.  mix_isotropic 0 -> 1 on d03 AND d04.
# ---------------------------------------------------------------------------
# Revision b raised the lid, and the run got further and then tripped the
# health bound again -- this time on the POSITIVE side, at d04 step 5467:
#
#     w(56, 185, 85) = 239.48348999023438 m/s   violates upper bound <= 200
#
# Bit-identical across three instrumented reproductions.  A w-tendency
# instrument with a bitwise-ZERO residual proved the value comes out of the
# momentum equation rather than any bookkeeping seam, and an arena-NaN-poison
# run cleared the memory-aliasing lead outright.  So this is the physics
# doing it, and the physics it is doing is the horizontal mixing.
#
# WHY.  WRF hands horizontal_diffusion_w_2 the VERTICAL exchange coefficient
# (dyn_em/module_diffusion_em.F:3003, dummy spelled xkmv at :3524), and with
# mix_isotropic = 0 smag_km both BUILDS and CAPS that coefficient on the
# vertical length scale (:1890-1900):
#
#     xkmv = min( c_s^2 * dz^2 * |S| ,  mix_upper_bound * dz^2 / dt )
#
# The operator that consumes it then differences over dx.  Nothing in that
# chain compares the coefficient against the spacing it will be differenced
# over, so the reachable ratio is
#
#     mix_upper_bound * (dz_max / dx)^2
#
# which is independent of dt -- the cap carries 1/dt and the ratio carries dt.
# An explicit Laplacian multiplies a 2dx mode by 1 - 4*K*dt/dx^2 per step, so
# past 1/4 the sign flips and past 1/2 the mode GROWS.  On this tree, with
# dz_max = 650.3 m from the raised-lid ladder:
#
#     d01   3000 m   km_opt 4                        not exposed
#     d02   1000 m   km_opt 4                        not exposed
#     d03    500 m   km_opt 3    ratio 0.169         under the limit
#     d04    100 m   km_opt 3    ratio 4.23          17x the limit
#
# The trip measured 1.55 at the failing cell, and the pin in
# tests/test_anisotropic_mixing_w_stability.py measures the mode coming back
# INVERTED AND TWICE AS LARGE on this grid shape at 160 m/s.  The parents are
# immune by selector, not by luck: km_opt = 4 builds one coefficient on the
# horizontal spacing.
#
# THE FIX.  mix_isotropic = 1 on both LES children.  WRF then builds one
# length from (dx*dy*dz)^(1/3) and caps the vertical coefficient against the
# horizontal one, so what the horizontal operator receives is bounded by the
# spacing it differences over.  It is the standard LES choice for exactly
# this geometry, it is config-only, and it costs nothing this run cares
# about: the same pin measures kmv == kmh at every amplitude and no
# amplification anywhere.  d03 is switched with d04 even though d03 is under
# the limit today, because 0.169 and 4.23 come off the SAME ladder and a
# child that mixes differently from its parent is a seam nobody needs.
#
# NOT A RESTART.  mix_isotropic is inside the restart fingerprint, so
# attempt #3 runs from 00Z.  Revision b's file is FROZEN at
# configs/les_tornado_100m_mayfield_20211210_attempt2b.toml (sha256
# 3f3cbcb3...), because a committed result must keep pointing at the file it
# was produced under.  That digest read ffa4e5e3... here until 2026-08-09
# and never matched the file; the pin that is checked lives in
# tests/test_shipped_configs_mixing_stability.py, which is where the
# correct value came from.
#
# The other candidate fix -- clamping xkmv against a cap built on dx*dy in
# the kernel, one line -- is PARKED for a ruling.  It changes the operator
# for every configuration rather than this tree's request, which is a bigger
# decision than a run needs to make.
[experiment]
name = "les_tornado_100m_mayfield_20211210_attempt3"
# 00Z on 2021-12-11, the HRRR analysis at the window start.  Convective
# initiation upstream follows around 02Z and Mayfield is struck near 03:27Z,
# so the LES children get roughly 3.5 h of spin-up before the storm arrives.
start_time = 2021-12-11T00:00:00
# 7 h, 00Z -> 07Z.  One hour longer than attempt #1 because the model's
# corridor crossings are 04-06Z rather than the historical 03:27Z, so the
# window needs a tail past the event rather than more spin-up.  Not a
# restart: see the header.
run_seconds = 20700.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
# SET, unlike the demonstration.  Its restart_interval_s = 0.0 meant a run
# that could not be resumed had it died, and the scored receipt records that
# as a defect (nested-les-scored-2026-08-02.md:147-148).  3600 s is 240 whole
# root steps at dt = 15 s.  A 2+-domain tree is on the checkpointing route
# (woof/checkpoint_routes.py:67), so this is exercised, not decorative.
restart_interval_s = 3600.0

# UNCHANGED from attempt #1, and now a projection ORIGIN rather than a box
# centre: d01 and d02 stay exactly where they were so their prepared caches
# remain reusable, while d03 and d04 move off-centre onto the corridor.
# ---------------------------------------------------------------------------
# RADIATION DECLARATIONS.  THIS FILE IS A COMMITTED EXPERIMENT RECORD, NOT A
# TEMPLATE.  Do not copy it to start a forecast; copy a config whose
# radiation is real (both streams on, e.g.
# configs/battery/shape_3km_thompson_rrtmg_legacy.toml).
# ---------------------------------------------------------------------------
# JUSTIFY asymmetric-radiation-nocturnal-window-v1: this case runs shortwave
# with longwave OFF across a window that is night from end to end, which is
# the pairing the nocturnal guard exists to stop.  It is declared, not
# fixed, because the LES tornado ladder's attempts are REPRODUCTION
# ARTEFACTS: their bytes are the provenance of the certified dual-run
# comparisons and of the checkpoint the fine-cadence resume restarts from,
# so changing their physics would invalidate every receipt written against
# them rather than improve them.  Restart-tolerated field.
# JUSTIFY constant-downward-longwave-v1: the same fact, stated as the fact
# it actually is.  With ra_lw_physics = 0 nothing computes downward
# longwave -- the Dudhia adapter is shortwave-only and returns the array it
# was handed -- so Noah integrated a fixed 300 W m-2 for the entire run.
# The nocturnal token above was checked BEFORE any physics was inspected
# and so silently covered this too; it no longer does, and the two claims
# are now made separately.  WHAT IT MEANS FOR THIS LADDER'S RESULTS: the
# nocturnal boundary layer these runs produced was radiatively wrong, so
# their surface and near-surface fields are not admissible as skill, and
# no obs-skill claim was ever made from them.  The vortex-scale dynamics
# the attempts were staged to falsify are aloft and were adjudicated on
# their own terms.  The NEXT attempt runs real longwave.
acknowledgements = [
    "asymmetric-radiation-nocturnal-window-v1",
    "constant-downward-longwave-v1",
]

[projection]
map_proj = "lambert"
ref_lat = 36.72
ref_lon = -88.7
# The secant cone bracketing the reference latitude by +/- 10 deg, which is
# the rule woof/domain_wizard.py:1580-1581 applies.
truelat1 = 26.72
truelat2 = 46.72
stand_lon = -88.7

[shared]
# 73 full levels -> nz = 72 mass levels.  Generated and scored by
# tools/build_stretched_eta_ladder.py --nz 72 --dz0 20 --dz-max 650
