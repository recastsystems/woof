    0.74767, 0.73213, 0.71592, 0.69902, 0.68143,
    0.66313, 0.64413, 0.62443, 0.60402, 0.58292,
    0.56114, 0.5387, 0.51562, 0.49194, 0.46769,
    0.44293, 0.4177, 0.39206, 0.3661, 0.33989,
    0.31352, 0.2871, 0.26073, 0.23453, 0.20863,
    0.18329, 0.15988, 0.13829, 0.11839, 0.10009,
    0.08328, 0.06787, 0.05377, 0.04089, 0.02915,
    0.01847, 0.00878, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
